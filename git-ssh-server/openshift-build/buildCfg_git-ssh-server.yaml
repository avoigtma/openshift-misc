apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: git-ssh-server-build
  labels:
    app: git-ssh-server
spec:
  failedBuildsHistoryLimit: 2
  successfulBuildsHistoryLimit: 2
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/avoigtma/openshift-misc.git
      ref: main
    contextDir: git-ssh-server/containerfile
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
    env:
      - name: REPO_URL
        valueFrom:
          configMapKeyRef:
            name: git-server-config
            key: REPO_URL
      - name: BRANCH_NAME
        valueFrom:
          configMapKeyRef:
            name: git-server-config
            key: BRANCH_NAME
      - name: PUBLIC_KEY
        valueFrom:
          configMapKeyRef:
            name: git-server-config
            key: PUBLIC_KEY
  output:
    to:
      kind: ImageStreamTag
      name: git-ssh-server:latest