apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: git-server-anyuid-role
rules:
- apiGroups:
  - security.openshift.io
  resources:
  - securitycontextconstraints
  resourceNames:
  - anyuid
  verbs:
  - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: git-server-anyuid-binding
subjects:
- kind: ServiceAccount
  name: git-server
roleRef:
  kind: Role
  name: git-server-anyuid-role
  apiGroup: rbac.authorization.k8s.io
